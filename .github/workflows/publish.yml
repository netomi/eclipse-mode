name: Publish to Open VSX (Staging)

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx vsce package --no-dependencies

      - name: Publish to Open VSX Staging
        run: npx ovsx-test publish *.vsix --registryUrl https://staging.open-vsx.org --trusted-publishing
