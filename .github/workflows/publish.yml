name: Publish to Open VSX (Staging)

on:
  release:
    types: [published]
  # so a multi-target publish can be exercised without cutting a release; the version in
  # package.json still has to be one that is not published for these targets yet
  workflow_dispatch:

env:
  # Packaged and published one at a time, but in a single ovsx invocation: the CLI exchanges the
  # OIDC identity once per extension and shares the token across every package it publishes, which
  # is the thing under test.
  TARGET_PLATFORMS: linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64
  OVSX_VERSION: 1.2.0-dev.1
  REGISTRY_URL: https://staging.open-vsx.org

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Package extension for every target platform
        run: |
          for target in $TARGET_PLATFORMS; do
            npx vsce package --no-dependencies --target "$target" --out "eclipse-mode-$target.vsix"
          done
          ls -l ./*.vsix

      # One invocation, so every package shares the single token the exchange issues. Publishing them
      # in separate invocations would exchange the identity once per target and prove nothing.
      - name: Publish to Open VSX Staging
        run: |
          npx ovsx-test@$OVSX_VERSION publish \
            --packagePath ./*.vsix \
            --registryUrl $REGISTRY_URL \
            --trusted-publishing
